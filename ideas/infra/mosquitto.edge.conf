# EDGE: preparar /etc/helioguard/mqtt.passwd antes de levantar.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
# La red Compose es privada; acceso externo al broker NO publicado.
# Cuando haya sensores por LAN configurar TLS con CA/certificados y puertos apropiados.

# PLANTILLA CLOUD — NO EJECUTABLE hasta publicar imágenes de API, WEB y ANALYTICS.
# Colocar detrás de proxy TLS del VPS; no publicar la base de datos.
name: helioguard-cloud
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-helioguard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 6
  api:
    image: helioguard/api:${APP_VERSION:?Definir APP_VERSION}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-helioguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Definir POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
    networks: [internal, frontend]
    # Completar JWT/OIDC, secretos y perfil PROD antes de desplegar.
  analytics:
    image: helioguard/analytics:${APP_VERSION:?Definir APP_VERSION}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_BASE_URL: http://api:8080
    networks: [internal]
  web:
    image: helioguard/web:${APP_VERSION:?Definir APP_VERSION}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '127.0.0.1:8088:80'
    networks: [frontend]
    # Imagen web con Nginx: proxy /api a api:8080 y SPA fallback.
networks:
  internal: {internal: true}
  frontend: {}
volumes:
  postgres-data: {}

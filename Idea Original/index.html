<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelioGuard · Telemetría solar confiable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--cielo:#E9F0F4;--panel:#F8FBFC;--tinta:#10243A;--suave:#5B7186;--sol:#F0A202;
--verde:#2F8F5B;--amarillo:#B97D00;--rojo:#C2362B;--linea:#C9D8E2;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--cielo:#0F1C2A;--panel:#162637;--tinta:#E6EEF5;--suave:#93A8BA;
--linea:#27405A;--verde:#4CC88A;--amarillo:#F0B73A;--rojo:#F0675B;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--cielo);color:var(--tinta);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh}
h1,h2,.num{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:20px 28px 8px;gap:12px;flex-wrap:wrap}
h1{font-size:1.6rem;font-weight:700}
header p{color:var(--suave)}
#banda{margin:8px 28px 0;padding:14px 18px;border-radius:6px;color:#fff;font-weight:500;background:var(--verde);transition:background .3s}
#banda.amarillo{background:var(--amarillo)}#banda.rojo{background:var(--rojo)}#banda.off{background:var(--suave)}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px;padding:20px 28px}
@media(max-width:820px){main{grid-template-columns:1fr;padding:16px}header,#banda{margin-inline:16px;padding-inline:0}#banda{padding-inline:14px}}
.caja{background:var(--panel);border:1px solid var(--linea);border-radius:6px;padding:16px}
h2{font-size:1rem;font-weight:700;margin-bottom:10px}
canvas{width:100%;height:340px;display:block}
.leyenda{display:flex;gap:18px;color:var(--suave);font-size:.875rem;margin-top:8px}
.leyenda i{display:inline-block;width:22px;height:0;border-top:3px solid var(--tinta);vertical-align:middle;margin-right:6px}
.leyenda i.e{border-top:3px dashed var(--sol)}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{font-size:1.5rem;font-weight:700}.num small{font-size:.8rem;color:var(--suave);font-weight:500}
.dato span{display:block;color:var(--suave);font-size:.8125rem}
.perdida{margin-top:14px;padding-top:14px;border-top:1px solid var(--linea)}
.alerta{border-left:4px solid var(--rojo);padding:6px 10px;margin-bottom:8px;background:var(--cielo);border-radius:0 4px 4px 0}
.alerta.amarillo{border-color:var(--amarillo)}.alerta b{display:block}
.alerta span,.vacio{color:var(--suave);font-size:.875rem}
.controles{display:flex;flex-wrap:wrap;gap:10px;padding:0 28px 28px}
@media(max-width:820px){.controles{padding:0 16px 24px}}
button{font:inherit;font-weight:500;padding:10px 16px;border-radius:6px;border:1.5px solid var(--tinta);
background:transparent;color:var(--tinta);cursor:pointer}
button:hover{background:var(--tinta);color:var(--cielo)}
button.activo{background:var(--tinta);color:var(--cielo)}
button:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>HelioGuard</h1>
  <p>Hora simulada <b id="reloj">--:--</b> · Instalación de 5 kW</p>
</header>
<div id="banda" role="status">Conectando con el servidor…</div>
<main>
  <section class="caja">
    <h2>Potencia: real vs esperada (kW)</h2>
    <canvas id="grafico" aria-label="Gráfico de potencia real contra esperada durante el día"></canvas>
    <div class="leyenda"><span><i></i>Real medida</span><span><i class="e"></i>Esperada por irradiación</span></div>
  </section>
  <aside>
    <section class="caja">
      <h2>Alertas</h2>
      <div id="alertas"><p class="vacio">Sin alertas.</p></div>
      <div class="perdida">
        <span class="vacio">Pérdida estimada del día</span>
        <div class="num"><span id="kwh">0</span> <small>kWh</small> · $<span id="pesos">0</span></div>
      </div>
    </section>
    <section class="caja" style="margin-top:20px">
      <h2>Última lectura</h2>
      <div class="datos" id="datos"></div>
    </section>
  </aside>
</main>
<div class="controles">
  <button data-modo="normal" class="activo">Día normal</button>
  <button data-modo="suciedad">Ensuciar panel</button>
  <button data-modo="replay">Ataque replay</button>
  <button data-modo="inyeccion">Inyección falsa</button>
  <button id="reiniciar">Reiniciar día</button>
</div>
<script>
const $ = s => document.querySelector(s);
const MENSAJES = {
  verde: "Todo en orden: los datos coinciden con lo esperado.",
  amarillo: "Atención: el rendimiento es menor al esperado.",
  rojo: "Alerta de integridad: no confíes en estos datos."
};
const CAMPOS = [["potencia","Potencia","kW"],["tension","Tensión","V"],["corriente","Corriente","A"],
  ["irradiancia","Irradiancia","W/m²"],["temperatura","Temperatura","°C"]];
let pts = [];

const reloj = h => `${String(Math.floor(h)).padStart(2,"0")}:${String(Math.round((h%1)*60)).padStart(2,"0")}`;
const color = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function render(d){
  $("#banda").className = d.estado;
  $("#banda").textContent = MENSAJES[d.estado];
  $("#reloj").textContent = reloj(d.hora);
  $("#kwh").textContent = d.perdida_kwh;
  $("#pesos").textContent = d.perdida_pesos.toLocaleString("es-AR");
  $("#alertas").innerHTML = d.alertas.length
    ? d.alertas.map(a => `<div class="alerta ${a.nivel}"><b>${a.titulo}</b><span>${a.texto}</span></div>`).join("")
    : '<p class="vacio">Sin alertas.</p>';
  $("#datos").innerHTML = CAMPOS.map(([k,n,u]) =>
    `<div class="dato"><span>${n}</span><div class="num">${d.lectura[k].toFixed(1)} <small>${u}</small></div></div>`).join("");
}

function dibujar(){
  const c = $("#grafico"), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const W = c.clientWidth, H = c.clientHeight, m = {l:40,r:10,t:10,b:28};
  const X = h => m.l + (h-7)/12*(W-m.l-m.r), Y = p => H-m.b - p/6*(H-m.t-m.b);
  g.font = "12px 'IBM Plex Sans',sans-serif"; g.fillStyle = color("--suave"); g.strokeStyle = color("--linea");
  for(let p=0;p<=6;p+=2){g.beginPath();g.moveTo(m.l,Y(p));g.lineTo(W-m.r,Y(p));g.stroke();g.fillText(p,8,Y(p)+4)}
  for(let h=7;h<=19;h+=2) g.fillText(h+":00",X(h)-14,H-8);
  const linea = (campo, col, dash) => {
    g.beginPath(); g.setLineDash(dash); g.strokeStyle = col; g.lineWidth = 2.5;
    pts.forEach((q,i) => i ? g.lineTo(X(q.h),Y(q[campo])) : g.moveTo(X(q.h),Y(q[campo])));
    g.stroke(); g.setLineDash([]);
  };
  linea("e", color("--sol"), [6,5]); linea("p", color("--tinta"), []);
}

async function tick(){
  try{
    const d = await (await fetch("/api/telemetria")).json();
    if(pts.length && d.hora < pts[pts.length-1].h) pts = [];
    pts.push({h:d.hora, p:d.lectura.potencia, e:d.lectura.esperada});
    render(d); dibujar();
  }catch(e){
    $("#banda").className = "off";
    $("#banda").textContent = "Sin conexión: iniciá el servidor con python app.py";
  }
}

document.querySelectorAll("[data-modo]").forEach(b => b.onclick = async () => {
  await fetch("/api/modo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({modo:b.dataset.modo})});
  document.querySelectorAll("[data-modo]").forEach(x => x.classList.toggle("activo", x === b));
});
$("#reiniciar").onclick = async () => {
  await fetch("/api/reiniciar",{method:"POST"}); pts = [];
  document.querySelectorAll("[data-modo]").forEach(x => x.classList.toggle("activo", x.dataset.modo === "normal"));
};
window.addEventListener("resize", dibujar);
tick(); setInterval(tick, 1000);
</script>
</body>
</html>

@if (phase() === 'loading') {
  <p role="status">Abriendo la configuración local…</p>
} @else {
  <h1 class="text-3xl">Configuración</h1>
  <p class="mt-2 max-w-2xl text-sm text-q-muted">
    Semilla helioguard-hackaton-v4. Reloj guardado en UTC y mostrado en America/Argentina/Jujuy.
    La persistencia es localStorage de esta copia. No hay API.
  </p>
  <div class="mt-4 flex flex-wrap gap-2">
    <button type="button" class="min-h-11 rounded-ui bg-q-terracotta px-3 text-sm font-semibold text-white" (click)="download()">Exportar JSON</button>
    <label class="inline-flex min-h-11 cursor-pointer items-center rounded-ui border border-q-line px-3 text-sm">
      Importar JSON
      <input class="sr-only" type="file" accept="application/json" (change)="onFile($event)" />
    </label>
    <button type="button" class="min-h-11 rounded-ui border border-q-line px-3 text-sm" (click)="store.reset()">Restablecer demo</button>
  </div>
  @if (message()) {
    <p class="mt-3 text-sm" role="status">{{ message() }}</p>
  }
}
